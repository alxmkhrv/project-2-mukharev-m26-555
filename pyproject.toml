[project]
name = "project-2-mukharev-m26-555"
version = "0.1.0"
description = "Консольная база данных на Python с CRUD-операциями и хранением данных в JSON"
readme = "README.md"
authors = [
    { name = "alexander", email = "mukharev1@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main"
project = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.uv.build-backend]
module-name = "primitive_db"